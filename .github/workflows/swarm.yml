name: COAS autonomous swarm

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: coas-autonomous-swarm
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Prevent overlapping autonomous proposals
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          pending="$(gh pr list --state open --limit 200 --json headRefName --jq '[.[] | select(.headRefName | startswith("coas-cycle-"))] | length')"
          if [ "$pending" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "An autonomous candidate PR is already open. Preserve it for review or merge before starting another cycle." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  swarm:
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Verify main
        shell: bash
        run: |
          if git grep -nI $'\xE2\x80\x94' -- .; then
            echo "Forbidden U+2014 punctuation found. Replace it before autonomous work continues."
            exit 1
          fi
          test -z "$(gofmt -l .)"
          go test ./...

      - name: Prepare isolated runtime branch
        id: branch
        shell: bash
        run: |
          git config user.name "coas-agent-swarm[bot]"
          git config user.email "coas-agent-swarm[bot]@users.noreply.github.com"
          git fetch origin main
          branch="coas-cycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -B "$branch" origin/main
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "Candidate branch: $branch" >> "$GITHUB_STEP_SUMMARY"

      - name: Run 100-agent core swarm
        run: |
          go run ./cmd/coas-swarm -root . -out artifacts/swarm -commit "${GITHUB_SHA}"

      - name: Run D.N.A. Bible Robot Edition experiment
        run: |
          go run ./cmd/coas-robot-bible \
            -root . \
            -commit "${GITHUB_SHA}" \
            -cycle "${GITHUB_RUN_NUMBER}" \
            -out artifacts/robot-bible

      - name: Run D.N.A. Bible God search experiment
        run: |
          go run ./cmd/coas-god-search \
            -commit "${GITHUB_SHA}" \
            -cycle "${GITHUB_RUN_NUMBER}" \
            -out artifacts/god-search

      - name: Append D.N.A. Bible autonomous chapter
        run: |
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go run ./cmd/coas-printing-press \
            -root . \
            -commit "${GITHUB_SHA}" \
            -cycle "${GITHUB_RUN_NUMBER}" \
            -run-id "${GITHUB_RUN_ID}" \
            -run-attempt "${GITHUB_RUN_ATTEMPT}" \
            -observed-at "${observed_at}" \
            -base-url "https://jupiter8nohate.github.io/cognitive-offloading-adaptive-symbiosis" \
            -out artifacts/printing-press

      - name: Authenticate to Google Search Console
        id: google-auth
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' && vars.GOOGLE_SEARCH_CONSOLE_SITE_URL != '' && vars.GOOGLE_SEARCH_CONSOLE_INSPECTION_URL != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          create_credentials_file: false

      - name: Run 100-agent search index audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_WEB_SEARCH_API_KEY: ${{ secrets.GOOGLE_WEB_SEARCH_API_KEY }}
          GOOGLE_WEB_SEARCH_CLIENT_ID: ${{ secrets.GOOGLE_WEB_SEARCH_CLIENT_ID }}
          GOOGLE_WEB_SEARCH_USER_IP: ${{ secrets.GOOGLE_WEB_SEARCH_USER_IP }}
          GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          GOOGLE_SEARCH_CONSOLE_INSPECTION_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_INSPECTION_URL }}
        run: |
          go run ./cmd/coas-index-audit \
            -commit "${GITHUB_SHA}" \
            -out artifacts/index-audit

      - name: Run 100-agent privacy swarm
        run: |
          go run ./cmd/coas-privacy-swarm -root . -out artifacts/privacy-swarm -commit "${GITHUB_SHA}"
          gofmt -w agent_runtime/generated_privacy_agents.go

      - name: Let the agents author their own Go runtime
        run: |
          go run ./cmd/coas-self-author -root . -commit "${GITHUB_SHA}"
          gofmt -w agent_runtime/generated_agents.go

      - name: Run 200-agent LiveBrain ecosystem
        run: |
          go run ./cmd/coas-ecosystem \
            -root . \
            -commit "${GITHUB_SHA}" \
            -state artifacts/ecosystem/state.json \
            -report-json artifacts/ecosystem/latest.json \
            -report-md artifacts/ecosystem/latest.md \
            -runtime agent_runtime/autonomous_ecosystem.go \
            -cycles 3 \
            -max-ephemeral-workers 32
          gofmt -w agent_runtime/autonomous_ecosystem.go

      - name: Generate bounded glitch evangelism artifact
        run: |
          go run ./cmd/coas-evangelism \
            -commit "${GITHUB_SHA}" \
            -out artifacts/evangelism/latest.md \
            -receipt artifacts/evangelism/latest.json

      - name: Generate tamper-evident preservation manifest
        run: |
          go run ./cmd/coas-preserve \
            -root . \
            -commit "${GITHUB_SHA}" \
            -out artifacts/preservation/latest.json \
            -markdown artifacts/preservation/latest.md

      - name: Stage candidate
        id: stage
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify staged candidate before publication
        if: steps.stage.outputs.changed == 'true'
        shell: bash
        run: |
          if git grep -nI $'\xE2\x80\x94' -- .; then
            echo "Forbidden U+2014 punctuation found in autonomous candidate."
            exit 1
          fi
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
          git diff --cached --name-only > /tmp/coas-changed.txt
          go run ./cmd/coas-merge-policy \
            -report artifacts/swarm/latest.json \
            -changed /tmp/coas-changed.txt \
            -checks-passed=true

      - name: Commit and publish verified candidate branch
        if: steps.stage.outputs.changed == 'true'
        shell: bash
        run: |
          git commit -m "chore(agents): append verified autonomous D.N.A. Bible cycle"
          git push --set-upstream origin "${{ steps.branch.outputs.name }}"

      - name: Open candidate pull request
        if: steps.stage.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          url="$(gh pr create \
            --head "${{ steps.branch.outputs.name }}" \
            --base main \
            --title "COAS autonomous D.N.A. Bible cycle ${GITHUB_RUN_NUMBER}" \
            --body "Generated from a fresh main checkout. Before publication, the workflow ran formatting checks, Go unit tests, go vet, and the COAS merge constitution. This PR preserves evidence and the append-only chapter. No workflow or control-plane changes are authorized.")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "Candidate PR: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge verified candidate when repository policy permits
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh pr merge "${{ steps.pr.outputs.number }}" \
            --squash \
            --delete-branch=false \
            --subject "COAS autonomous D.N.A. Bible cycle" \
            --body "Merged only after staged code verification and the COAS merge constitution passed."; then
            echo "Candidate merged successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merge not permitted yet. Candidate PR remains open for human review or required checks." >> "$GITHUB_STEP_SUMMARY"
          fi

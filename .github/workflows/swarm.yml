name: COAS autonomous swarm

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: coas-autonomous-swarm
  cancel-in-progress: false

jobs:
  swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Verify main
        shell: bash
        run: |
          if git grep -nI $'\xE2\x80\x94' -- .; then
            echo "Forbidden U+2014 punctuation found. Replace it before autonomous work continues."
            exit 1
          fi
          test -z "$(gofmt -l .)"
          go test ./...

      - name: Prepare runtime branch
        run: |
          git config user.name "coas-agent-swarm[bot]"
          git config user.email "coas-agent-swarm[bot]@users.noreply.github.com"
          git fetch origin coas-agent-runtime || true
          if git show-ref --verify --quiet refs/remotes/origin/coas-agent-runtime; then
            git checkout -B coas-agent-runtime origin/coas-agent-runtime
            if ! git rebase origin/main; then
              git rebase --abort
              git checkout -B coas-agent-runtime origin/main
            fi
          else
            git checkout -b coas-agent-runtime origin/main
          fi

      - name: Run 100-agent core swarm
        run: |
          go run ./cmd/coas-swarm -root . -out artifacts/swarm -commit "${GITHUB_SHA}"

      - name: Run 100-agent search index audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_WEB_SEARCH_API_KEY: ${{ secrets.GOOGLE_WEB_SEARCH_API_KEY }}
          GOOGLE_WEB_SEARCH_CLIENT_ID: ${{ secrets.GOOGLE_WEB_SEARCH_CLIENT_ID }}
          GOOGLE_WEB_SEARCH_USER_IP: ${{ secrets.GOOGLE_WEB_SEARCH_USER_IP }}
        run: |
          go run ./cmd/coas-index-audit \
            -commit "${GITHUB_SHA}" \
            -out artifacts/index-audit

      - name: Run 100-agent privacy swarm
        run: |
          go run ./cmd/coas-privacy-swarm -root . -out artifacts/privacy-swarm -commit "${GITHUB_SHA}"
          gofmt -w agent_runtime/generated_privacy_agents.go

      - name: Let the agents author their own Go runtime
        run: |
          go run ./cmd/coas-self-author -root . -commit "${GITHUB_SHA}"
          gofmt -w agent_runtime/generated_agents.go

      - name: Run 200-agent LiveBrain ecosystem
        run: |
          go run ./cmd/coas-ecosystem \
            -root . \
            -commit "${GITHUB_SHA}" \
            -state artifacts/ecosystem/state.json \
            -report-json artifacts/ecosystem/latest.json \
            -report-md artifacts/ecosystem/latest.md \
            -runtime agent_runtime/autonomous_ecosystem.go \
            -cycles 3 \
            -max-ephemeral-workers 32
          gofmt -w agent_runtime/autonomous_ecosystem.go

      - name: Generate bounded glitch evangelism artifact
        run: |
          go run ./cmd/coas-evangelism \
            -commit "${GITHUB_SHA}" \
            -out artifacts/evangelism/latest.md \
            -receipt artifacts/evangelism/latest.json

      - name: Generate tamper-evident preservation manifest
        run: |
          go run ./cmd/coas-preserve \
            -root . \
            -commit "${GITHUB_SHA}" \
            -out artifacts/preservation/latest.json \
            -markdown artifacts/preservation/latest.md

      - name: Commit every agent-produced candidate change
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(agents): refresh COAS autonomous ecosystem"
          git push origin coas-agent-runtime
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify autonomous candidate
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          if git grep -nI $'\xE2\x80\x94' -- .; then
            echo "Forbidden U+2014 punctuation found in autonomous candidate."
            exit 1
          fi
          test -z "$(gofmt -l .)"
          go test ./...
          git diff --name-only origin/main...HEAD > /tmp/coas-changed.txt
          go run ./cmd/coas-merge-policy \
            -report artifacts/swarm/latest.json \
            -changed /tmp/coas-changed.txt \
            -checks-passed=true

      - name: Open or resolve runtime pull request
        if: steps.commit.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --head coas-agent-runtime --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create \
              --head coas-agent-runtime \
              --base main \
              --title "COAS autonomous ecosystem candidate" \
              --body "Self-directed output from the 200-agent COAS system plus the 100-agent search index audit. Core merge authority remains controlled by the repository MergeConstitution.")"
            pr="${url##*/}"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Autonomous main merge
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --squash \
            --delete-branch=false \
            --subject "COAS autonomous ecosystem merge" \
            --body "Merged autonomously after the core constitution, provenance, path-scope, formatting, punctuation, search-audit, and test gates passed."

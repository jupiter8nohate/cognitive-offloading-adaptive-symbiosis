name: COAS autonomous swarm

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: coas-autonomous-swarm
  cancel-in-progress: false

jobs:
  swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Verify main
        run: |
          test -z "$(gofmt -l .)"
          go test ./...

      - name: Prepare runtime branch
        run: |
          git config user.name "coas-agent-swarm[bot]"
          git config user.email "coas-agent-swarm[bot]@users.noreply.github.com"
          git fetch origin coas-agent-runtime || true
          if git show-ref --verify --quiet refs/remotes/origin/coas-agent-runtime; then
            git checkout -B coas-agent-runtime origin/coas-agent-runtime
            if ! git rebase origin/main; then
              git rebase --abort
              git checkout -B coas-agent-runtime origin/main
            fi
          else
            git checkout -b coas-agent-runtime origin/main
          fi

      - name: Run 100-agent swarm
        run: |
          go run ./cmd/coas-swarm -root . -out artifacts/swarm -commit "${GITHUB_SHA}"

      - name: Generate bounded glitch evangelism artifact
        run: |
          go run ./cmd/coas-evangelism             -commit "${GITHUB_SHA}"             -out artifacts/evangelism/latest.md             -receipt artifacts/evangelism/latest.json

      - name: Commit every agent-produced candidate change
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(agents): refresh COAS swarm report"
          git push origin coas-agent-runtime
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify autonomous candidate
        if: steps.commit.outputs.changed == 'true'
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          git diff --name-only origin/main...HEAD > /tmp/coas-changed.txt
          go run ./cmd/coas-merge-policy \
            -report artifacts/swarm/latest.json \
            -changed /tmp/coas-changed.txt \
            -checks-passed=true

      - name: Open or resolve runtime pull request
        if: steps.commit.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --head coas-agent-runtime --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create \
              --head coas-agent-runtime \
              --base main \
              --title "COAS autonomous swarm candidate" \
              --body "Self-directed output from the 100-agent COAS swarm. Merge is controlled by the repository MergeConstitution.")"
            pr="${url##*/}"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Autonomous main merge
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --squash \
            --delete-branch=false \
            --subject "COAS autonomous swarm merge" \
            --body "Merged autonomously after the 100-agent constitution, provenance, path-scope, formatting, and test gates passed."
